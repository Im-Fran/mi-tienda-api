name: CI

on:
  push:
    branches: [dev, main, master]
  pull_request:
    branches: [dev, main, master]

# Cancel stale runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Type-check ────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  # ── 2. Tests ─────────────────────────────────────────────────────────────────
  #
  # Tests run inside Miniflare (via @cloudflare/vitest-pool-workers).
  # El vitest.config.ts inyecta todos los bindings de Cloudflare (D1, KV, R2)
  # y credenciales OAuth/email falsas — no se necesita cuenta real de Cloudflare.
  #
  # Secrets needed: none
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # workerd y esbuild ejecutan postinstall scripts (declarados en allowScripts)
        run: npm ci

      - name: Run tests
        run: npm test
